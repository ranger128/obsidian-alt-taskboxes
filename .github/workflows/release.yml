name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # If the manifest version is already released, bump the patch version and commit it back.
      - name: Resolve version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            while git rev-parse -q --verify "refs/tags/$version" >/dev/null; do
              version=$(node -p "const [a,b,c]='$version'.split('.').map(Number); [a,b,c+1].join('.')")
            done
            node -e '
              const fs = require("fs");
              const v = process.argv[1];
              const write = (f, o) => fs.writeFileSync(f, JSON.stringify(o, null, "\t") + "\n");
              const m = require("./manifest.json"); m.version = v; write("manifest.json", m);
              const p = require("./package.json"); p.version = v; write("package.json", p);
              const vs = require("./versions.json"); vs[v] = m.minAppVersion; write("versions.json", vs);
            ' "$version"
            npm install --package-lock-only --ignore-scripts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Bump version to $version"
            git push origin HEAD:${{ github.event.pull_request.base.ref }}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            main.js manifest.json styles.css
